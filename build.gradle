plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = "just-excavators-mc${project.artifact_minecraft_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"justexcavators" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Backport artifacts use the generated resources committed by the 26.3 branch.
sourceSets.client.java.exclude("net/hfstack/justexcavators/datagen/**")

fabricApi {
	configureDataGeneration {
		client = true
		modId = "justexcavators"
	}
}

repositories {
	maven {
		name = "Jared's Maven"
		url = "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
			includeGroup "net.mezzdev.config"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	exclude "assets/justexcavators/items/**"
	eachFile { details ->
		details.path = details.path
				.replace("data/justexcavators/recipe/", "data/justexcavators/recipes/")
				.replace("data/justexcavators/advancement/", "data/justexcavators/advancements/")
				.replace("data/justexcavators/loot_table/", "data/justexcavators/loot_tables/")
				.replace("data/justexcavators/tags/block/", "data/justexcavators/tags/blocks/")
				.replace("data/justexcavators/tags/item/", "data/justexcavators/tags/items/")
	}

	doLast {
		outputs.files.asFileTree.matching { include "data/justexcavators/recipes/*.json" }.each { recipeFile ->
			def json = new groovy.json.JsonSlurper().parse(recipeFile)
			if (json.result instanceof Map && json.result.id) {
				def components = json.result.components
				json.result.item = json.result.remove("id")
				json.result.remove("components")
				if (components?."justexcavators:excavation_mode") {
					json.type = "justexcavators:mode_shaped"
					json.excavation_mode = components."justexcavators:excavation_mode"
				}
			}
			recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
		outputs.files.asFileTree.matching { include "data/justexcavators/advancements/**/*.json" }.each { advancementFile ->
			def json = new groovy.json.JsonSlurper().parse(advancementFile)
			if (json.display?.icon?.id) {
				json.display.icon.item = json.display.icon.remove("id")
				json.display.icon.remove("components")
			}
			json.remove("sends_telemetry_event")
			json.criteria?.values()?.each { criterion ->
				if (criterion.conditions?.items instanceof List) {
					criterion.conditions.items.each { predicate ->
						if (predicate.items instanceof String && predicate.items.startsWith("#")) {
							predicate.tag = predicate.items.substring(1)
							predicate.remove("items")
						} else if (predicate.items instanceof String) {
							predicate.items = [predicate.items]
						}
						predicate.remove("components")
						predicate.remove("predicates")
					}
				}
			}
			advancementFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(Jar).configureEach {
	from("LICENSE") {
		rename { "LICENSE_just-excavators" }
	}
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("sourcesJar") {
	mustRunAfter(tasks.named("runDatagen"))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
